name: Android Debug

# 每次 push 自动构建 debug 包并上传为本次 run 的 artifact，不创建 Release、不占用 tag；也可手动触发。
# debug 用构建工具自带的调试密钥签名，不需要任何仓库 secret；正式 release 包走本地 keystore.properties 流程。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: 单元测试
        run: gradle :core:test --console=plain

      - name: 打包 debug
        run: gradle :app:assembleDebug --console=plain

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION"

      - name: 重命名产物
        run: cp app/build/outputs/apk/debug/app-debug.apk "ai-gateway-${{ steps.version.outputs.version }}-debug.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-${{ steps.version.outputs.version }}-debug
          path: ai-gateway-${{ steps.version.outputs.version }}-debug.apk
